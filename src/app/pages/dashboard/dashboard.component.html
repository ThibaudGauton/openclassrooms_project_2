
<div>
  <app-header [titlePage]="titlePage" [stats]="stats"></app-header>
  <p class="intro-text">
    Welcome to the Olympic Games dashboard. Explore the historical performance of participating nations and compare the total number of medals won by each country across all editions.
  </p>
  @if (isLoading) {
    <p class="loading">Loading data...</p>
  } @else if (error) {
    <app-error-message [message]="error"></app-error-message>
  } @else {
    <app-medal-chart [countries]="countries" [sumOfAllMedalsYears]="sumOfAllMedalsYears"></app-medal-chart>
  }
</div>
